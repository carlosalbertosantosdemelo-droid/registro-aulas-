<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro de Aulas</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f2f4f8;
    padding:20px;
}

h2{
    text-align:center;
}

.card{
    background:#ffffff;
    padding:15px;
    margin-bottom:20px;
    border-radius:10px;
    box-shadow:0 4px 10px rgba(0,0,0,0.08);
}

input, select, button{
    width:100%;
    padding:8px;
    margin-top:6px;
    border-radius:6px;
    border:1px solid #ccc;
}

button{
    background:#1976d2;
    color:white;
    border:none;
    cursor:pointer;
}

button:hover{
    background:#0d47a1;
}

table{
    width:100%;
    border-collapse: collapse;
    margin-top:10px;
}

th, td{
    padding:8px;
    border-bottom:1px solid #ddd;
}

th{
    background:#1976d2;
    color:white;
}
</style>
</head>

<body>

<h2>📘 Registro de Aulas</h2>

<div class="card">
<h3>Nova Aula</h3>

<input type="date" id="data">
<input type="text" id="professor" placeholder="Professor">
<input type="text" id="sala" placeholder="Sala">
<input type="text" id="conteudo" placeholder="Conteúdo">

<button id="btnSalvar">Salvar Aula</button>
</div>

<div class="card">
<h3>Filtros</h3>

<select id="filtroMes">
<option value="">Todos os Meses</option>
</select>

<select id="filtroProfessor">
<option value="">Todos os Professores</option>
</select>

</div>

<div class="card">
<h3>Lista de Aulas</h3>

<table>
<thead>
<tr>
<th>Data</th>
<th>Mês</th>
<th>Professor</th>
<th>Sala</th>
<th>Conteúdo</th>
</tr>
</thead>
<tbody id="lista"></tbody>
</table>

</div>

<script>

document.addEventListener("DOMContentLoaded", function(){

let aulas = JSON.parse(localStorage.getItem("aulas")) || [];

const btnSalvar = document.getElementById("btnSalvar");
const filtroMes = document.getElementById("filtroMes");
const filtroProfessor = document.getElementById("filtroProfessor");
const lista = document.getElementById("lista");

btnSalvar.addEventListener("click", salvar);
filtroMes.addEventListener("change", mostrar);
filtroProfessor.addEventListener("change", mostrar);

function salvar(){

let data = document.getElementById("data").value;
let professor = document.getElementById("professor").value.trim();
let sala = document.getElementById("sala").value.trim();
let conteudo = document.getElementById("conteudo").value.trim();

if(!data || !professor || !sala || !conteudo){
alert("Preencha todos os campos.");
return;
}

let dataObj = new Date(data);
let mes = dataObj.toLocaleString("pt-BR",{month:"long"});

aulas.push({data, mes, professor, sala, conteudo});

localStorage.setItem("aulas", JSON.stringify(aulas));

document.getElementById("data").value="";
document.getElementById("professor").value="";
document.getElementById("sala").value="";
document.getElementById("conteudo").value="";

atualizarFiltros();
mostrar();
}

function atualizarFiltros(){

filtroMes.innerHTML = '<option value="">Todos os Meses</option>';
filtroProfessor.innerHTML = '<option value="">Todos os Professores</option>';

let meses = [...new Set(aulas.map(a=>a.mes))];
let professores = [...new Set(aulas.map(a=>a.professor))];

meses.forEach(m=>{
let op = document.createElement("option");
op.value = m;
op.textContent = m;
filtroMes.appendChild(op);
});

professores.forEach(p=>{
let op = document.createElement("option");
op.value = p;
op.textContent = p;
filtroProfessor.appendChild(op);
});

}

function mostrar(){

lista.innerHTML = "";

let filtradas = aulas.filter(a=>
(filtroMes.value==="" || a.mes===filtroMes.value) &&
(filtroProfessor.value==="" || a.professor===filtroProfessor.value)
);

filtradas.sort((a,b)=> new Date(a.data) - new Date(b.data));

filtradas.forEach(a=>{
lista.innerHTML += `
<tr>
<td>${new Date(a.data).toLocaleDateString("pt-BR")}</td>
<td>${a.mes}</td>
<td>${a.professor}</td>
<td>${a.sala}</td>
<td>${a.conteudo}</td>
</tr>
`;
});

}

atualizarFiltros();
mostrar();

});
</script>

</body>
</html>
