<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro de Aulas</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI;}

body{
background:linear-gradient(135deg,#1e3a8a,#dc2626);
display:flex;
justify-content:center;
padding:20px;
}

/* SPLASH SCREEN */
.splash{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:linear-gradient(135deg,#1e3a8a,#dc2626);
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
color:#fff;
z-index:999;
}

.splash img{
width:120px;
margin-bottom:20px;
}

.app{
width:100%;
max-width:430px;
height:90vh;
background:#fff;
border-radius:30px;
overflow:hidden;
display:none;
flex-direction:column;
box-shadow:0 25px 50px rgba(0,0,0,.4);
}

.header{
background:linear-gradient(135deg,#1e3a8a,#dc2626);
color:#fff;
padding:20px;
text-align:center;
font-weight:600;
}

.content{
flex:1;
overflow-y:auto;
padding:18px;
}

.tela{display:none;}
.tela.ativa{display:block;}

input,select,textarea{
width:100%;
padding:12px;
margin:6px 0;
border-radius:10px;
border:1px solid #cbd5e1;
}

textarea{resize:none;}

.btn{
width:100%;
padding:12px;
margin-top:8px;
border:none;
border-radius:12px;
background:#dc2626;
color:#fff;
font-weight:600;
cursor:pointer;
}

.card{
background:#f1f5f9;
padding:14px;
border-radius:14px;
margin:10px 0;
box-shadow:0 6px 15px rgba(0,0,0,.15);
font-size:14px;
}

.excluir{
margin-top:8px;
padding:6px 10px;
border:none;
border-radius:8px;
background:#1e3a8a;
color:#fff;
cursor:pointer;
}

.mes{
margin-top:15px;
font-weight:bold;
color:#1e3a8a;
}

.nav{
display:flex;
justify-content:space-around;
background:#ffffff;
border-top:2px solid #e2e8f0;
padding:10px 0;
}

.nav button{
background:none;
border:none;
font-size:12px;
text-align:center;
color:#1e3a8a;
font-weight:600;
cursor:pointer;
}

.nav button span{
display:block;
font-size:20px;
}
</style>
</head>

<body>

<!-- TELA INICIAL -->
<div class="splash" id="splash">
<img src="https://via.placeholder.com/120x120.png?text=LOGO" alt="Logo Escola">
<h2>Nome da Escola</h2>
<p>Registro de Aulas</p>
</div>

<div class="app" id="app">

<div class="header">
📘 Registro de Aulas
</div>

<div class="content">

<!-- NOVA AULA -->
<div id="aula" class="tela ativa">
<h3>➕ Nova Aula</h3>
<input type="date" id="dataAula">
<select id="profAula"></select>
<select id="discAula"></select>
<select id="salaAula"></select>
<textarea id="conteudoAula" placeholder="Conteúdo da Aula"></textarea>
<textarea id="proximaAula" placeholder="Conteúdo da Próxima Aula"></textarea>
<button class="btn" onclick="addAula()">Salvar Aula</button>
</div>

<!-- LISTA -->
<div id="lista" class="tela">
<h3>📊 Minhas Aulas</h3>

<input type="date" id="filtroData" onchange="renderAulas()">
<select id="filtroProfessor" onchange="renderAulas()"></select>
<select id="filtroSala" onchange="renderAulas()"></select>

<div id="listaAulas"></div>
</div>

<!-- PROFESSORES -->
<div id="prof" class="tela">
<h3>👨‍🏫 Professores</h3>
<input id="nomeProf" placeholder="Nome do Professor">
<button class="btn" onclick="addProfessor()">Salvar</button>
<div id="listaProf"></div>
</div>

<!-- DISCIPLINAS -->
<div id="disc" class="tela">
<h3>📚 Disciplinas</h3>
<input id="nomeDisc" placeholder="Nome da Disciplina">
<button class="btn" onclick="addDisciplina()">Salvar</button>
<div id="listaDisc"></div>
</div>

<!-- SALAS -->
<div id="sala" class="tela">
<h3>🏫 Salas</h3>
<input id="nomeSala" placeholder="Nome da Sala">
<button class="btn" onclick="addSala()">Salvar</button>
<div id="listaSala"></div>
</div>

</div>

<div class="nav">
<button onclick="abrir('aula')"><span>➕</span>Aula</button>
<button onclick="abrir('lista')"><span>📊</span>Aulas</button>
<button onclick="abrir('prof')"><span>👨‍🏫</span>Prof</button>
<button onclick="abrir('disc')"><span>📚</span>Disc</button>
<button onclick="abrir('sala')"><span>🏫</span>Salas</button>
</div>

</div>

<script>

/* SPLASH */
setTimeout(()=>{
document.getElementById("splash").style.display="none";
document.getElementById("app").style.display="flex";
},3000);

/* DADOS */
let professores = JSON.parse(localStorage.getItem("professores")) || [];
let disciplinas = JSON.parse(localStorage.getItem("disciplinas")) || [];
let salas = JSON.parse(localStorage.getItem("salas")) || [];
let aulas = JSON.parse(localStorage.getItem("aulas")) || [];

function salvar(){
localStorage.setItem("professores",JSON.stringify(professores));
localStorage.setItem("disciplinas",JSON.stringify(disciplinas));
localStorage.setItem("salas",JSON.stringify(salas));
localStorage.setItem("aulas",JSON.stringify(aulas));
}

function abrir(id){
document.querySelectorAll(".tela").forEach(t=>t.classList.remove("ativa"));
document.getElementById(id).classList.add("ativa");
if(id==="aula") atualizarSelects();
if(id==="lista"){ atualizarFiltros(); renderAulas(); }
}

/* CADASTROS */

function addProfessor(){
if(!nomeProf.value) return;
professores.push({id:Date.now(),nome:nomeProf.value});
nomeProf.value="";
salvar();
renderProf();
}

function addDisciplina(){
if(!nomeDisc.value) return;
disciplinas.push({id:Date.now(),nome:nomeDisc.value});
nomeDisc.value="";
salvar();
renderDisc();
}

function addSala(){
if(!nomeSala.value) return;
salas.push({id:Date.now(),nome:nomeSala.value});
nomeSala.value="";
salvar();
renderSala();
}

function renderProf(){
listaProf.innerHTML="";
professores.forEach((p,i)=>{
listaProf.innerHTML+=`<div class="card">${p.nome}
<button class="excluir" onclick="professores.splice(${i},1);salvar();renderProf();">Excluir</button></div>`;
});
}

function renderDisc(){
listaDisc.innerHTML="";
disciplinas.forEach((d,i)=>{
listaDisc.innerHTML+=`<div class="card">${d.nome}
<button class="excluir" onclick="disciplinas.splice(${i},1);salvar();renderDisc();">Excluir</button></div>`;
});
}

function renderSala(){
listaSala.innerHTML="";
salas.forEach((s,i)=>{
listaSala.innerHTML+=`<div class="card">${s.nome}
<button class="excluir" onclick="salas.splice(${i},1);salvar();renderSala();">Excluir</button></div>`;
});
}

/* SELECTS */

function atualizarSelects(){
profAula.innerHTML="";
discAula.innerHTML="";
salaAula.innerHTML="";
professores.forEach(p=> profAula.innerHTML+=`<option value="${p.id}">${p.nome}</option>`);
disciplinas.forEach(d=> discAula.innerHTML+=`<option value="${d.id}">${d.nome}</option>`);
salas.forEach(s=> salaAula.innerHTML+=`<option value="${s.id}">${s.nome}</option>`);
}

/* FILTROS */

function atualizarFiltros(){
filtroProfessor.innerHTML="<option value=''>Todos Professores</option>";
filtroSala.innerHTML="<option value=''>Todas Salas</option>";
professores.forEach(p=> filtroProfessor.innerHTML+=`<option value="${p.id}">${p.nome}</option>`);
salas.forEach(s=> filtroSala.innerHTML+=`<option value="${s.id}">${s.nome}</option>`);
}

function renderAulas(){
listaAulas.innerHTML="";
let fd=filtroData.value;
let fp=filtroProfessor.value;
let fs=filtroSala.value;

let ordenadas=[...aulas].sort((a,b)=> new Date(b.data)-new Date(a.data));

let mesAtual="";

ordenadas.forEach((a,i)=>{
if((!fd||a.data===fd)&&(!fp||a.prof===fp)&&(!fs||a.sala===fs)){
let dataObj=new Date(a.data);
let mes=dataObj.toLocaleString("pt-BR",{month:"long",year:"numeric"});
if(mes!==mesAtual){
mesAtual=mes;
listaAulas.innerHTML+=`<div class="mes">${mes.toUpperCase()}</div>`;
}
let p=professores.find(x=>x.id==a.prof);
let d=disciplinas.find(x=>x.id==a.disc);
let s=salas.find(x=>x.id==a.sala);
listaAulas.innerHTML+=`
<div class="card">
📅 ${a.data}<br>
🏫 ${s?s.nome:""}<br>
👨‍🏫 ${p?p.nome:""}<br>
📚 ${d?d.nome:""}<br>
📝 ${a.conteudo}<br>
➡️ <strong>Próxima Aula:</strong> ${a.proxima||"-"}
<button class="excluir" onclick="aulas.splice(${i},1);salvar();renderAulas();">Excluir</button>
</div>`;
}
});
}

/* INICIALIZAR */
renderProf();
renderDisc();
renderSala();
atualizarSelects();

</script>

</body>
</html>
