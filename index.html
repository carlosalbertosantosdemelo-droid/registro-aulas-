<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro de Aulas</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI;}

body{
background:linear-gradient(135deg,#1e3a8a,#dc2626);
display:flex;
justify-content:center;
padding:20px;
}

.app{
width:100%;
max-width:420px;
background:#fff;
border-radius:28px;
overflow:hidden;
box-shadow:0 25px 50px rgba(0,0,0,.4);
}

.header{
background:linear-gradient(135deg,#1e3a8a,#dc2626);
color:#fff;
padding:22px;
text-align:center;
}

.content{padding:18px;}

.tela{display:none;}
.tela.ativa{display:block;}

.menu button{
width:100%;
padding:14px;
margin:7px 0;
border:none;
border-radius:14px;
background:linear-gradient(135deg,#1e3a8a,#dc2626);
color:#fff;
font-weight:600;
cursor:pointer;
}

input,select,textarea{
width:100%;
padding:12px;
margin:6px 0;
border-radius:10px;
border:1px solid #cbd5e1;
}

textarea{resize:none;}

.btn{
width:100%;
padding:12px;
margin-top:8px;
border:none;
border-radius:12px;
background:#dc2626;
color:#fff;
font-weight:600;
cursor:pointer;
}

.btn.voltar{background:#1e3a8a;}

.card{
background:#f1f5f9;
padding:14px;
border-radius:14px;
margin:10px 0;
box-shadow:0 6px 15px rgba(0,0,0,.15);
font-size:14px;
}

.excluir{
margin-top:6px;
padding:6px 10px;
border:none;
border-radius:8px;
background:#1e3a8a;
color:#fff;
cursor:pointer;
}

.filtro{
background:#e2e8f0;
padding:10px;
border-radius:10px;
margin-bottom:10px;
}
</style>
</head>

<body>

<div class="app">

<div class="header">
<h2>📘 Registro de Aulas</h2>
</div>

<div class="content">

<!-- MENU -->
<div id="menu" class="tela ativa menu">
<button onclick="abrir('prof')">👨‍🏫 Professores</button>
<button onclick="abrir('disc')">📚 Disciplinas</button>
<button onclick="abrir('sala')">🏫 Salas</button>
<button onclick="abrir('aula')">➕ Nova Aula</button>
<button onclick="abrir('lista')">📊 Minhas Aulas</button>
</div>

<!-- LISTA AULAS -->
<div id="lista" class="tela">
<h3>📊 Minhas Aulas</h3>

<div class="filtro">
Filtrar por Data:
<input type="date" id="filtroData" onchange="renderAulas()">

Filtrar por Sala:
<select id="filtroSala" onchange="renderAulas()"></select>
</div>

<div id="listaAulas"></div>
<button class="btn voltar" onclick="voltar()">Voltar</button>
</div>

</div>
</div>

<script>

let professores = JSON.parse(localStorage.getItem("professores")) || [];
let disciplinas = JSON.parse(localStorage.getItem("disciplinas")) || [];
let salas = JSON.parse(localStorage.getItem("salas")) || [];
let aulas = JSON.parse(localStorage.getItem("aulas")) || [];

function salvar(){
localStorage.setItem("professores",JSON.stringify(professores));
localStorage.setItem("disciplinas",JSON.stringify(disciplinas));
localStorage.setItem("salas",JSON.stringify(salas));
localStorage.setItem("aulas",JSON.stringify(aulas));
}

function abrir(id){
document.querySelectorAll(".tela").forEach(t=>t.classList.remove("ativa"));
document.getElementById(id).classList.add("ativa");
if(id==="lista"){ atualizarFiltroSala(); renderAulas(); }
}

function voltar(){
document.querySelectorAll(".tela").forEach(t=>t.classList.remove("ativa"));
menu.classList.add("ativa");
}

/* FILTRO SALA */
function atualizarFiltroSala(){
let select=document.getElementById("filtroSala");
select.innerHTML="<option value=''>Todas as Salas</option>";
salas.forEach(s=>{
select.innerHTML+=`<option value="${s.id}">${s.nome}</option>`;
});
}

/* RENDER AULAS COM ORDENAÇÃO */
function renderAulas(){

let lista=document.getElementById("listaAulas");
lista.innerHTML="";

let filtroData=document.getElementById("filtroData").value;
let filtroSala=document.getElementById("filtroSala").value;

/* ORDENAR POR DATA (mais recente primeiro) */
let aulasOrdenadas=[...aulas].sort((a,b)=> new Date(b.data)-new Date(a.data));

aulasOrdenadas.forEach((a,i)=>{

if(
(!filtroData || a.data===filtroData) &&
(!filtroSala || a.sala===filtroSala)
){

let p=professores.find(x=>x.id==a.prof);
let d=disciplinas.find(x=>x.id==a.disc);
let s=salas.find(x=>x.id==a.sala);

lista.innerHTML+=`
<div class="card">
📅 <strong>${a.data}</strong><br>
🏫 ${s?s.nome:""}<br>
👨‍🏫 ${p?p.nome:""}<br>
📚 ${d?d.nome:""}<br>
📝 ${a.conteudo}<br>
</div>`;
}
});

}

</script>

</body>
</html>
