<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro de Aulas Pro</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial, sans-serif;}

body{
background: linear-gradient(135deg,#5f6fd8,#8a4fd1);
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

.container{
width:380px;
background:#f1f1f1;
border-radius:25px;
overflow:hidden;
box-shadow:0 20px 40px rgba(0,0,0,0.2);
}

.header{
background: linear-gradient(135deg,#5f6fd8,#d84fa1);
color:white;
padding:40px 20px;
text-align:center;
}

.header h1{
font-size:32px;
margin-bottom:10px;
}

.header p{
opacity:0.9;
}

.content{
padding:25px;
}

.button{
width:100%;
padding:18px;
margin-bottom:18px;
border:none;
border-radius:40px;
font-size:18px;
color:white;
cursor:pointer;
box-shadow:0 8px 20px rgba(0,0,0,0.2);
}

.blue{background:#4b43c6;}
.green{background:#19a66a;}

.hidden{display:none;}

input,select,textarea{
width:100%;
padding:10px;
margin-bottom:10px;
border-radius:8px;
border:1px solid #ccc;
}

.small-btn{
background:#4b43c6;
color:white;
border:none;
padding:6px 10px;
border-radius:6px;
cursor:pointer;
margin-top:5px;
}

.logout{
position:absolute;
top:10px;
right:10px;
background:red;
color:white;
padding:6px 10px;
border:none;
border-radius:6px;
cursor:pointer;
}

</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen" class="container">
<div class="header">
<h1>📘 Registro de Aulas Pro</h1>
<p>Faça login para continuar</p>
</div>
<div class="content">
<input type="text" id="user" placeholder="Usuário">
<input type="password" id="pass" placeholder="Senha">
<button class="button blue" onclick="login()">Entrar</button>
</div>
</div>

<!-- APP -->
<div id="app" class="container hidden">
<button class="logout" onclick="logout()">Sair</button>

<div class="header">
<h1>📘 Registro de Aulas Pro</h1>
<p>Professores • Disciplinas • Salas • Aulas</p>
</div>

<div class="content" id="home">

<button class="button blue" onclick="showSection('professores')">👨‍🏫 Gerenciar Professores</button>
<button class="button blue" onclick="showSection('disciplinas')">📚 Gerenciar Disciplinas</button>
<button class="button blue" onclick="showSection('salas')">🏫 Gerenciar Salas</button>
<button class="button green" onclick="showSection('novaAula')">➕ Nova Aula</button>
<button class="button blue" onclick="showSection('minhasAulas')">📊 Minhas Aulas</button>

</div>

<div class="content hidden" id="professores">
<h3>Professores</h3>
<input id="novoProfessor" placeholder="Nome do professor">
<button class="small-btn" onclick="addProfessor()">Adicionar</button>
<ul id="listaProfessores"></ul>
<button class="small-btn" onclick="voltar()">Voltar</button>
</div>

<div class="content hidden" id="disciplinas">
<h3>Disciplinas</h3>
<input id="novaDisciplina" placeholder="Nome da disciplina">
<button class="small-btn" onclick="addDisciplina()">Adicionar</button>
<ul id="listaDisciplinas"></ul>
<button class="small-btn" onclick="voltar()">Voltar</button>
</div>

<div class="content hidden" id="salas">
<h3>Salas</h3>
<input id="novaSala" placeholder="Nome da sala">
<button class="small-btn" onclick="addSala()">Adicionar</button>
<ul id="listaSalas"></ul>
<button class="small-btn" onclick="voltar()">Voltar</button>
</div>

<div class="content hidden" id="novaAula">
<h3>Nova Aula</h3>
<select id="professorSelect"></select>
<select id="disciplinaSelect"></select>
<select id="salaSelect"></select>
<input type="date" id="dataAula">
<textarea id="conteudoAula" placeholder="Conteúdo da aula"></textarea>

<label>
<input type="checkbox" id="usarComoProxima">
 Usar como próxima aula
</label>

<button class="small-btn" onclick="salvarAula()">Salvar Aula</button>
<button class="small-btn" onclick="voltar()">Voltar</button>
</div>

<div class="content hidden" id="minhasAulas">
<h3>Minhas Aulas</h3>

<input type="date" id="filtroData" onchange="renderAulas()">

<div id="listaAulas"></div>

<button class="small-btn" onclick="voltar()">Voltar</button>
</div>

</div>

<script>
let professores=[],disciplinas=[],salas=[],aulas=[];
let ultimaAtividade=Date.now();

function login(){
if(user.value==="admin" && pass.value==="1234"){
loginScreen.classList.add("hidden");
app.classList.remove("hidden");
}
}

function logout(){
location.reload();
}

document.onclick=document.onmousemove=document.onkeypress=function(){
ultimaAtividade=Date.now();
};

setInterval(()=>{
if(Date.now()-ultimaAtividade>60000){
logout();
}
},5000);

function showSection(id){
home.classList.add("hidden");
document.querySelectorAll("#app .content").forEach(e=>e.classList.add("hidden"));
document.getElementById(id).classList.remove("hidden");
updateSelects();
renderLists();
renderAulas();
}

function voltar(){
document.querySelectorAll("#app .content").forEach(e=>e.classList.add("hidden"));
home.classList.remove("hidden");
}

function addProfessor(){
if(novoProfessor.value){
professores.push(novoProfessor.value);
novoProfessor.value="";
renderLists();
}
}

function addDisciplina(){
if(novaDisciplina.value){
disciplinas.push(novaDisciplina.value);
novaDisciplina.value="";
renderLists();
}
}

function addSala(){
if(novaSala.value){
salas.push(novaSala.value);
novaSala.value="";
renderLists();
}
}

function renderLists(){
listaProfessores.innerHTML=professores.map(p=>"<li>"+p+"</li>").join("");
listaDisciplinas.innerHTML=disciplinas.map(d=>"<li>"+d+"</li>").join("");
listaSalas.innerHTML=salas.map(s=>"<li>"+s+"</li>").join("");
}

function updateSelects(){
professorSelect.innerHTML=professores.map(p=>"<option>"+p+"</option>").join("");
disciplinaSelect.innerHTML=disciplinas.map(d=>"<option>"+d+"</option>").join("");
salaSelect.innerHTML=salas.map(s=>"<option>"+s+"</option>").join("");
}

function salvarAula(){
let aula={
professor:professorSelect.value,
disciplina:disciplinaSelect.value,
sala:salaSelect.value,
data:dataAula.value,
conteudo:conteudoAula.value,
proxima:usarComoProxima.checked
};

aulas.push(aula);

if(usarComoProxima.checked){
aulas.forEach(a=>{if(a!==aula)a.proxima=false});
}

conteudoAula.value="";
usarComoProxima.checked=false;

alert("Aula salva!");
}

function renderAulas(){
let filtro=filtroData.value;
let lista=aulas.filter(a=>!filtro || a.data===filtro);

listaAulas.innerHTML=lista.map(a=>`
<div style="background:white;padding:10px;margin-bottom:10px;border-radius:10px;">
<strong>${a.professor}</strong><br>
${a.disciplina} - ${a.sala}<br>
${a.data}<br>
Conteúdo: ${a.conteudo}<br>
${a.proxima?"<span style='color:green;'>Próxima Aula</span>":""}
<button class="small-btn" onclick="definirProxima(${aulas.indexOf(a)})">Usar como próxima aula</button>
</div>
`).join("");
}

function definirProxima(index){
aulas.forEach(a=>a.proxima=false);
aulas[index].proxima=true;
renderAulas();
}

</script>
</body>
</html>
