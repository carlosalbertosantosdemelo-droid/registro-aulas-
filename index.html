<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro de Aulas Pro</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}
body{
background: linear-gradient(135deg,#5f6fd8,#8a4fd1);
display:flex;justify-content:center;align-items:center;
min-height:100vh;
}
.container{
width:390px;background:#f1f1f1;border-radius:25px;
overflow:hidden;box-shadow:0 20px 40px rgba(0,0,0,0.2);
position:relative;
}
.header{
background: linear-gradient(135deg,#5f6fd8,#d84fa1);
color:white;padding:40px 20px;text-align:center;
}
.content{padding:25px;}
.button{
width:100%;padding:18px;margin-bottom:15px;
border:none;border-radius:40px;font-size:17px;
color:white;cursor:pointer;
box-shadow:0 8px 20px rgba(0,0,0,0.2);
}
.blue{background:#4b43c6;}
.green{background:#19a66a;}
input,select,textarea{
width:100%;padding:10px;margin-bottom:10px;
border-radius:8px;border:1px solid #ccc;
}
textarea{resize:none;height:80px;}
.small-btn{
background:#4b43c6;color:white;border:none;
padding:6px 10px;border-radius:6px;cursor:pointer;margin:5px 0;
}
.logout{
position:absolute;top:10px;right:10px;
background:red;color:white;border:none;
padding:5px 10px;border-radius:6px;cursor:pointer;
}
.hidden{display:none;}
.card{
background:white;padding:10px;border-radius:10px;margin-bottom:10px;
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen" class="container">
<div class="header">
<h1>📘 Registro de Aulas Pro</h1>
<p>Login do Administrador</p>
</div>
<div class="content">
<input type="text" id="user" placeholder="Usuário">
<input type="password" id="pass" placeholder="Senha">
<button class="button blue" onclick="login()">Entrar</button>
</div>
</div>

<!-- APP -->
<div id="app" class="container hidden">
<button class="logout" onclick="logout()">Sair</button>
<div class="header">
<h1>📘 Registro de Aulas Pro</h1>
<p>Professores • Disciplinas • Salas • Aulas</p>
</div>

<div class="content" id="home">
<button class="button blue" onclick="show('professores')">👨‍🏫 Gerenciar Professores</button>
<button class="button blue" onclick="show('disciplinas')">📚 Gerenciar Disciplinas</button>
<button class="button blue" onclick="show('salas')">🏫 Gerenciar Salas</button>
<button class="button green" onclick="show('novaAula')">➕ Nova Aula</button>
<button class="button blue" onclick="show('minhasAulas')">📊 Minhas Aulas</button>
</div>

<div class="content hidden" id="professores">
<input id="novoProfessor" placeholder="Nome do professor">
<button class="small-btn" onclick="addProfessor()">Adicionar</button>
<ul id="listaProfessores"></ul>
<button class="small-btn" onclick="voltar()">Voltar</button>
</div>

<div class="content hidden" id="disciplinas">
<input id="novaDisciplina" placeholder="Nome da disciplina">
<button class="small-btn" onclick="addDisciplina()">Adicionar</button>
<ul id="listaDisciplinas"></ul>
<button class="small-btn" onclick="voltar()">Voltar</button>
</div>

<div class="content hidden" id="salas">
<input id="novaSala" placeholder="Nome da sala">
<button class="small-btn" onclick="addSala()">Adicionar</button>
<ul id="listaSalas"></ul>
<button class="small-btn" onclick="voltar()">Voltar</button>
</div>

<div class="content hidden" id="novaAula">
<select id="professorSelect"></select>
<select id="disciplinaSelect"></select>
<select id="salaSelect"></select>
<input type="date" id="dataAula">
<textarea id="conteudoAtual" placeholder="Conteúdo da Aula Atual"></textarea>
<textarea id="conteudoProxima" placeholder="Conteúdo da Próxima Aula"></textarea>
<button class="small-btn" onclick="salvarAula()">Salvar Aula</button>
<button class="small-btn" onclick="voltar()">Voltar</button>
</div>

<div class="content hidden" id="minhasAulas">
<input type="date" id="filtroData" onchange="renderAulas()">
<select id="filtroProfessor" onchange="renderAulas()"></select>
<select id="filtroDisciplina" onchange="renderAulas()"></select>
<div id="listaAulas"></div>
<button class="small-btn" onclick="voltar()">Voltar</button>
</div>

</div>

<script>
let professores = JSON.parse(localStorage.getItem("professores")) || [];
let disciplinas = JSON.parse(localStorage.getItem("disciplinas")) || [];
let salas = JSON.parse(localStorage.getItem("salas")) || [];
let aulas = JSON.parse(localStorage.getItem("aulas")) || [];

let ultimaAtividade=Date.now();

function salvarLocal(){
localStorage.setItem("professores",JSON.stringify(professores));
localStorage.setItem("disciplinas",JSON.stringify(disciplinas));
localStorage.setItem("salas",JSON.stringify(salas));
localStorage.setItem("aulas",JSON.stringify(aulas));
}

function login(){
if(user.value==="admin" && pass.value==="1234"){
loginScreen.classList.add("hidden");
app.classList.remove("hidden");
updateSelects();
renderLists();
renderAulas();
}
}

function logout(){location.reload();}

document.onclick=document.onmousemove=document.onkeypress=function(){
ultimaAtividade=Date.now();
};
setInterval(()=>{
if(Date.now()-ultimaAtividade>60000){logout();}
},5000);

function show(id){
document.querySelectorAll("#app .content").forEach(e=>e.classList.add("hidden"));
document.getElementById(id).classList.remove("hidden");
updateSelects();
renderAulas();
}

function voltar(){
document.querySelectorAll("#app .content").forEach(e=>e.classList.add("hidden"));
home.classList.remove("hidden");
}

function addProfessor(){
if(novoProfessor.value){
professores.push(novoProfessor.value);
novoProfessor.value="";
salvarLocal();
renderLists();
}
}

function addDisciplina(){
if(novaDisciplina.value){
disciplinas.push(novaDisciplina.value);
novaDisciplina.value="";
salvarLocal();
renderLists();
}
}

function addSala(){
if(novaSala.value){
salas.push(novaSala.value);
novaSala.value="";
salvarLocal();
renderLists();
}
}

function renderLists(){
listaProfessores.innerHTML=professores.map(p=>"<li>"+p+"</li>").join("");
listaDisciplinas.innerHTML=disciplinas.map(d=>"<li>"+d+"</li>").join("");
listaSalas.innerHTML=salas.map(s=>"<li>"+s+"</li>").join("");
}

function updateSelects(){
professorSelect.innerHTML="<option value=''>Professor</option>"+professores.map(p=>"<option>"+p+"</option>").join("");
disciplinaSelect.innerHTML="<option value=''>Disciplina</option>"+disciplinas.map(d=>"<option>"+d+"</option>").join("");
salaSelect.innerHTML="<option value=''>Sala</option>"+salas.map(s=>"<option>"+s+"</option>").join("");

filtroProfessor.innerHTML="<option value=''>Todos Professores</option>"+professores.map(p=>"<option>"+p+"</option>").join("");
filtroDisciplina.innerHTML="<option value=''>Todas Disciplinas</option>"+disciplinas.map(d=>"<option>"+d+"</option>").join("");
}

function salvarAula(){
aulas.push({
professor:professorSelect.value,
disciplina:disciplinaSelect.value,
sala:salaSelect.value,
data:dataAula.value,
atual:conteudoAtual.value,
proxima:conteudoProxima.value
});
conteudoAtual.value="";
conteudoProxima.value="";
dataAula.value="";
salvarLocal();
alert("Aula salva permanentemente!");
renderAulas();
}

function renderAulas(){
let lista=aulas.filter(a=>
(!filtroData.value || a.data===filtroData.value) &&
(!filtroProfessor.value || a.professor===filtroProfessor.value) &&
(!filtroDisciplina.value || a.disciplina===filtroDisciplina.value)
);

listaAulas.innerHTML=lista.map((a,i)=>`
<div class="card">
<strong>${a.professor}</strong><br>
${a.disciplina} - ${a.sala}<br>
${a.data}<br><br>
<b>Aula Atual:</b><br>${a.atual || "-"}<br><br>
<b>Próxima Aula:</b><br>${a.proxima || "-"}<br>
<button class="small-btn" onclick="usarProxima(${i})">Usar Próxima como Atual</button>
</div>
`).join("");
}

function usarProxima(i){
aulas[i].atual=aulas[i].proxima;
aulas[i].proxima="";
salvarLocal();
renderAulas();
}

renderLists();
updateSelects();
renderAulas();
</script>
</body>
</html>
