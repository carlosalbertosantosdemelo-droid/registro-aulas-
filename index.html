<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro de Aulas Pro</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}

body{
background: linear-gradient(135deg,#5f6fd8,#8a4fd1);
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

.container{
width:390px;
background:#f1f1f1;
border-radius:25px;
overflow:hidden;
box-shadow:0 20px 40px rgba(0,0,0,0.2);
position:relative;
}

.header{
background: linear-gradient(135deg,#5f6fd8,#d84fa1);
color:white;
padding:35px 20px;
text-align:center;
}

.content{padding:20px;}

.button{
width:100%;
padding:15px;
margin-bottom:12px;
border:none;
border-radius:40px;
font-size:16px;
color:white;
cursor:pointer;
box-shadow:0 8px 20px rgba(0,0,0,0.2);
}

.blue{background:#4b43c6;}
.green{background:#19a66a;}

input,select,textarea{
width:100%;
padding:10px;
margin-bottom:10px;
border-radius:8px;
border:1px solid #ccc;
}

textarea{
resize:none;
height:70px;
}

.small-btn{
background:#4b43c6;
color:white;
border:none;
padding:6px 10px;
border-radius:6px;
cursor:pointer;
margin:5px 3px;
}

.delete-btn{
background:red;
}

.logout{
position:absolute;
top:10px;
right:10px;
background:red;
color:white;
border:none;
padding:5px 10px;
border-radius:6px;
cursor:pointer;
}

.hidden{display:none;}

.card{
background:white;
padding:10px;
border-radius:10px;
margin-bottom:10px;
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen" class="container">
<div class="header">
<h1>📘 Registro de Aulas Pro</h1>
<p>Login do Administrador</p>
</div>
<div class="content">
<input type="text" id="user" placeholder="Usuário">
<input type="password" id="pass" placeholder="Senha">
<button class="button blue" onclick="login()">Entrar</button>
</div>
</div>

<!-- APP -->
<div id="app" class="container hidden">

<button class="logout" onclick="logout()">Sair</button>

<div class="header">
<h1>📘 Registro de Aulas Pro</h1>
<p>Controle Escolar</p>
</div>

<div class="content" id="home">
<button class="button blue" onclick="showSection('professores')">👨‍🏫 Professores</button>
<button class="button blue" onclick="showSection('disciplinas')">📚 Disciplinas</button>
<button class="button blue" onclick="showSection('salas')">🏫 Salas</button>
<button class="button green" onclick="showSection('novaAula')">➕ Nova Aula</button>
<button class="button blue" onclick="showSection('minhasAulas')">📊 Minhas Aulas</button>
</div>

<div class="content hidden" id="professores">
<input id="novoProfessor" placeholder="Nome do professor">
<button class="small-btn" onclick="addProfessor()">Adicionar</button>
<ul id="listaProfessores"></ul>
<button class="small-btn" onclick="voltar()">Voltar</button>
</div>

<div class="content hidden" id="disciplinas">
<input id="novaDisciplina" placeholder="Nome da disciplina">
<button class="small-btn" onclick="addDisciplina()">Adicionar</button>
<ul id="listaDisciplinas"></ul>
<button class="small-btn" onclick="voltar()">Voltar</button>
</div>

<div class="content hidden" id="salas">
<input id="novaSala" placeholder="Nome da sala">
<button class="small-btn" onclick="addSala()">Adicionar</button>
<ul id="listaSalas"></ul>
<button class="small-btn" onclick="voltar()">Voltar</button>
</div>

<div class="content hidden" id="novaAula">
<select id="professorSelect"></select>
<select id="disciplinaSelect"></select>
<select id="salaSelect"></select>
<input type="date" id="dataAula">
<textarea id="conteudoAtual" placeholder="Conteúdo da Aula Atual"></textarea>
<textarea id="conteudoProxima" placeholder="Conteúdo da Próxima Aula"></textarea>
<button class="small-btn" onclick="salvarAula()">Salvar Aula</button>
<button class="small-btn" onclick="voltar()">Voltar</button>
</div>

<div class="content hidden" id="minhasAulas">
<input type="date" id="filtroData" onchange="renderAulas()">
<select id="filtroProfessor" onchange="renderAulas()"></select>
<select id="filtroDisciplina" onchange="renderAulas()"></select>
<div id="listaAulas"></div>
<button class="small-btn" onclick="voltar()">Voltar</button>
</div>

</div>

<script>

let professores = JSON.parse(localStorage.getItem("professores")) || [];
let disciplinas = JSON.parse(localStorage.getItem("disciplinas")) || [];
let salas = JSON.parse(localStorage.getItem("salas")) || [];
let aulas = JSON.parse(localStorage.getItem("aulas")) || [];

let aulaEditando = null;

function salvarStorage(){
localStorage.setItem("professores", JSON.stringify(professores));
localStorage.setItem("disciplinas", JSON.stringify(disciplinas));
localStorage.setItem("salas", JSON.stringify(salas));
localStorage.setItem("aulas", JSON.stringify(aulas));
}

function login(){
if(user.value==="admin" && pass.value==="1234"){
loginScreen.classList.add("hidden");
app.classList.remove("hidden");
atualizarTudo();
}
}

function logout(){location.reload();}

function showSection(id){
document.querySelectorAll("#app .content").forEach(e=>e.classList.add("hidden"));
document.getElementById(id).classList.remove("hidden");
atualizarTudo();
}

function voltar(){
document.querySelectorAll("#app .content").forEach(e=>e.classList.add("hidden"));
home.classList.remove("hidden");
aulaEditando=null;
}

function addProfessor(){
if(novoProfessor.value.trim()){
professores.push(novoProfessor.value.trim());
novoProfessor.value="";
salvarStorage();
atualizarTudo();
}
}

function addDisciplina(){
if(novaDisciplina.value.trim()){
disciplinas.push(novaDisciplina.value.trim());
novaDisciplina.value="";
salvarStorage();
atualizarTudo();
}
}

function addSala(){
if(novaSala.value.trim()){
salas.push(novaSala.value.trim());
novaSala.value="";
salvarStorage();
atualizarTudo();
}
}

function excluirProfessor(i){
if(confirm("Excluir professor?")){
professores.splice(i,1);
salvarStorage();
atualizarTudo();
}
}

function excluirDisciplina(i){
if(confirm("Excluir disciplina?")){
disciplinas.splice(i,1);
salvarStorage();
atualizarTudo();
}
}

function excluirSala(i){
if(confirm("Excluir sala?")){
salas.splice(i,1);
salvarStorage();
atualizarTudo();
}
}

function renderListas(){
listaProfessores.innerHTML = professores.map((p,i)=>`
<li>${p} <button class="small-btn delete-btn" onclick="excluirProfessor(${i})">Excluir</button></li>
`).join("");

listaDisciplinas.innerHTML = disciplinas.map((d,i)=>`
<li>${d} <button class="small-btn delete-btn" onclick="excluirDisciplina(${i})">Excluir</button></li>
`).join("");

listaSalas.innerHTML = salas.map((s,i)=>`
<li>${s} <button class="small-btn delete-btn" onclick="excluirSala(${i})">Excluir</button></li>
`).join("");
}

function atualizarSelects(){
professorSelect.innerHTML="<option value=''>Professor</option>"+professores.map(p=>`<option>${p}</option>`).join("");
disciplinaSelect.innerHTML="<option value=''>Disciplina</option>"+disciplinas.map(d=>`<option>${d}</option>`).join("");
salaSelect.innerHTML="<option value=''>Sala</option>"+salas.map(s=>`<option>${s}</option>`).join("");

filtroProfessor.innerHTML="<option value=''>Todos Professores</option>"+professores.map(p=>`<option>${p}</option>`).join("");
filtroDisciplina.innerHTML="<option value=''>Todas Disciplinas</option>"+disciplinas.map(d=>`<option>${d}</option>`).join("");
}

function salvarAula(){

if(!professorSelect.value) return alert("Selecione um professor");

let aula = {
professor: professorSelect.value,
disciplina: disciplinaSelect.value,
sala: salaSelect.value,
data: dataAula.value,
atual: conteudoAtual.value,
proxima: conteudoProxima.value
};

if(aulaEditando !== null){
aulas[aulaEditando]=aula;
aulaEditando=null;
}else{
aulas.push(aula);
}

conteudoAtual.value="";
conteudoProxima.value="";
dataAula.value="";

salvarStorage();
renderAulas();
}

function renderAulas(){
let lista = aulas.filter(a =>
(!filtroData.value || a.data===filtroData.value) &&
(!filtroProfessor.value || a.professor===filtroProfessor.value) &&
(!filtroDisciplina.value || a.disciplina===filtroDisciplina.value)
);

listaAulas.innerHTML = lista.map((a,i)=>`
<div class="card">
<strong>${a.professor}</strong><br>
${a.disciplina} - ${a.sala}<br>
${a.data || ""}<br><br>

<b>Aula Atual:</b><br>${a.atual || "-"}<br><br>
<b>Próxima Aula:</b><br>${a.proxima || "-"}<br><br>

<button class="small-btn" onclick="editarAula(${i})">✏️ Editar</button>
<button class="small-btn delete-btn" onclick="excluirAula(${i})">🗑️ Excluir</button>
<button class="small-btn" onclick="usarProxima(${i})">🔄 Usar Próxima</button>
</div>
`).join("");
}

function editarAula(i){
let a=aulas[i];
showSection('novaAula');
professorSelect.value=a.professor;
disciplinaSelect.value=a.disciplina;
salaSelect.value=a.sala;
dataAula.value=a.data;
conteudoAtual.value=a.atual;
conteudoProxima.value=a.proxima;
aulaEditando=i;
}

function excluirAula(i){
if(confirm("Excluir aula?")){
aulas.splice(i,1);
salvarStorage();
renderAulas();
}
}

function usarProxima(i){
aulas[i].atual=aulas[i].proxima;
aulas[i].proxima="";
salvarStorage();
renderAulas();
}

function atualizarTudo(){
renderListas();
atualizarSelects();
renderAulas();
}

atualizarTudo();

</script>
</body>
</html>
